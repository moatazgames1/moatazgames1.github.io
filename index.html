<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moataz Faucet - ربح البيتكوين</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .card { background: rgba(20, 20, 35, 0.95); border: 2px solid #ffd700; border-radius: 20px; padding: 30px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        h1 { color: #ffd700; font-size: 24px; margin-bottom: 20px; text-shadow: 0 0 10px rgba(255,215,0,0.4); }
        .form-group { margin-bottom: 15px; text-align: right; }
        .form-group label { display: block; margin-bottom: 5px; color: #ffaa00; font-weight: bold; }
        .form-group input { width: 100%; padding: 12px; background: #0a0a16; border: 1px solid #444; border-radius: 8px; color: #fff; font-size: 16px; outline: none; }
        .form-group input:focus { border-color: #ffd700; box-shadow: 0 0 8px rgba(255,215,0,0.4); }
        .btn { width: 100%; padding: 12px; background: linear-gradient(45deg, #ffd700, #ff8c00); border: none; border-radius: 8px; color: #000; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .btn:hover { opacity: 0.9; transform: scale(1.02); }
        .switch-btn { background: transparent; color: #00ffff; border: none; margin-top: 15px; cursor: pointer; font-size: 14px; text-decoration: underline; }
        .hidden { display: none !important; }

        .balance-title { color: #8f8fa8; font-size: 14px; text-transform: uppercase; margin-bottom: 5px; }
        .balance-amount { font-size: 34px; font-weight: bold; color: #fff; margin-bottom: 20px; }
        .balance-amount span { color: #ffd700; }
        
        .claim-btn {
            width: 140px; height: 140px; background: linear-gradient(135deg, #ffd700, #ff8c00);
            border-radius: 50%; border: none; outline: none; cursor: pointer;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            margin: 25px auto; box-shadow: 0 0 25px rgba(255, 215, 0, 0.4); transition: 0.2s;
        }
        .claim-btn:active { transform: scale(0.95); }
        .claim-btn span { font-size: 40px; }
        .claim-btn p { color: #000; font-weight: bold; font-size: 14px; margin-top: 5px; }
        .timer-text { color: #00ffff; font-size: 15px; margin-top: 10px; font-weight: bold; }
        .logout-btn { background: transparent; border: 1px solid #ff4444; color: #ff4444; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="card">
        <div id="auth-section">
            <h1 id="form-title">تسجيل الدخول إلى فوسيت</h1>
            
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="name@example.com" value="motazfaysel5@gmail.com">
            </div>
            
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="password" placeholder="********">
            </div>

            <button class="btn" id="action-btn" onclick="handleAuth()">دخول</button>
            <button class="switch-btn" onclick="toggleMode()" id="switch-mode-text">إنشاء حساب جديد</button>
        </div>

        <div id="faucet-section" class="hidden">
            <h1>أهلاً بك يا بطل ⚡</h1>
            <div class="balance-title">رصيدك الحالي (ساتوشي)</div>
            <div class="balance-amount"><span id="user-balance">0.00</span> Coins</div>

            <button class="claim-btn" id="claimBtn" onclick="claimReward()">
                <span>⚡</span>
                <p>Claim</p>
            </button>

            <div class="timer-text" id="timerDisplay">جاهز للنقر والربح!</div>
            <button class="btn logout-btn" onclick="logoutUser()">تسجيل الخروج</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const p1 = "AIzaSyD1wdWJ";
        const p2 = "af77xStVw4f3";
        const p3 = "UuVqI-jB0";

        const firebaseConfig = {
            apiKey: p1 + p2 + p3,
            authDomain: "moataz-games.firebaseapp.com",
            projectId: "moataz-games",
            storageBucket: "moataz-games.appspot.com",
            messagingSenderId: "338870344560",
            appId: "1:338870344560:web:8d6d6a169bdfa14"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let isSignUp = false;
        let currentUserUid = null;

        window.toggleMode = function() {
            isSignUp = !isSignUp;
            document.getElementById('form-title').innerText = isSignUp ? "إنشاء حساب جديد" : "تسجيل الدخول إلى فوسيت";
            document.getElementById('action-btn').innerText = isSignUp ? "تسجيل" : "دخول";
            document.getElementById('switch-mode-text').innerText = isSignUp ? "لديك حساب بالفعل؟ سجل الدخول" : "إنشاء حساب جديد";
        }

        window.handleAuth = async function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if(!email || !password) {
                alert("الرجاء إدخال البريد وكلمة المرور!");
                return;
            }

            alert("جاري الاتصال بقاعدة البيانات...");

            try {
                if (isSignUp) {
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    await setDoc(doc(db, "users", userCredential.user.uid), {
                        email: email,
                        balance: 0.00,
                        lastClaimTime: 0
                    });
                    alert("تم إنشاء الحساب بنجاح!");
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (error) {
                alert("خطأ في تسجيل الدخول: " + error.message);
            }
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserUid = user.uid;
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('faucet-section').classList.remove('hidden');
                await loadUserData(user.uid);
            } else {
                currentUserUid = null;
                document.getElementById('auth-section').classList.remove('hidden');
                document.getElementById('faucet-section').classList.add('hidden');
            }
        });

        async function loadUserData(uid) {
            const docRef = doc(db, "users", uid);
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                const data = docSnap.data();
                let bal = data.balance !== undefined ? data.balance : 0;
                document.getElementById('user-balance').innerText = bal.toFixed(2);
            } else {
                await setDoc(docRef, { balance: 0.00, lastClaimTime: 0 });
                document.getElementById('user-balance').innerText = "0.00";
            }
        }

        window.claimReward = async function() {
            if (!currentUserUid) return;

            alert("جاري عرض الإعلان وكسب الساتوشي...");
            let earned = +(Math.random() * (5 - 0.1) + 0.1).toFixed(2);

            const userRef = doc(db, "users", currentUserUid);
            
            try {
                await updateDoc(userRef, {
                    balance: increment(earned)
                });

                const docSnap = await getDoc(userRef);
                if (docSnap.exists()) {
                    document.getElementById('user-balance').innerText = docSnap.data().balance.toFixed(2);
                }

                alert(`مبروك! لقد ربحت ${earned} ساتوشي.`);
                startTimer(300); 
            } catch (e) {
                alert("حدث خطأ أثناء حفظ الأرباح: " + e.message);
            }
        }

        function startTimer(duration) {
            let timer = duration, minutes, seconds;
            let btn = document.getElementById('claimBtn');
            let display = document.getElementById('timerDisplay');
            
            btn.style.opacity = "0.5";
            btn.style.pointerEvents = "none";

            let interval = setInterval(function () {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);

                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                display.innerText = `انتظر: ${minutes}:${seconds} للمطالبة التالية`;

                if (--timer < 0) {
                    clearInterval(interval);
                    btn.style.opacity = "1";
                    btn.style.pointerEvents = "auto";
                    display.innerText = "جاهز للنقر والربح!";
                }
            }, 1000);
        }

        window.logoutUser = function() {
            signOut(auth);
        }
    </script>
</body>
</html>
