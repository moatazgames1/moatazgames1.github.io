<body class="min-h-screen flex flex-col justify-between selection:bg-purple-600 selection:text-white">

    <!-- ================= HEADER / NAVBAR ================= -->
    <header class="sticky top-0 z-50 glass-panel border-b border-gray-800/80 px-4 lg:px-8 py-3">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
            
            <!-- Logo & Brand -->
            <div class="flex items-center gap-3 cursor-pointer" onclick="switchTab('games')">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 via-indigo-500 to-cyan-400 flex items-center justify-center text-white font-black text-xl shadow-lg glow-purple">
                    M
                </div>
                <div>
                    <h1 class="text-xl lg:text-2xl font-extrabold tracking-wider text-gradient">Moataz Games</h1>
                    <p class="text-[10px] text-gray-400 font-medium -mt-1">منصة الألعاب والجوائز اليومية</p>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="flex-1 max-w-xs lg:max-w-md hidden md:block">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                    <input type="text" id="searchInput" oninput="filterGames()" placeholder="ابحث عن لعبه أو تحدي..." class="w-full bg-slate-900/90 text-sm text-gray-200 placeholder-gray-500 rounded-full pr-10 pl-4 py-2 border border-gray-700/60 focus:outline-none focus:border-purple-500 transition-all">
                </div>
            </div>

            <!-- User Dashboard Widget & Navigation Header -->
            <div class="flex items-center gap-2 lg:gap-3">
                
                <!-- Daily Reward Button -->
                <button onclick="claimDailyBonus()" id="dailyBonusBtn" class="flex items-center gap-1.5 lg:gap-2 bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-600 hover:to-yellow-700 text-slate-950 font-bold text-xs lg:text-sm px-3 lg:px-4 py-2 rounded-full transition-all shadow-md glow-gold">
                    <i class="fa-solid fa-gift text-sm lg:text-base animate-bounce"></i>
                    <span id="dailyBonusBtnText">المكافأة اليومية</span>
                </button>

                <!-- Coin Balance -->
                <div class="flex items-center gap-1.5 lg:gap-2 bg-slate-900/90 border border-amber-500/30 px-3 py-1.5 rounded-full">
                    <i class="fa-solid fa-coins text-amber-400 text-base lg:text-lg"></i>
                    <span id="userCoins" class="font-extrabold text-amber-300 text-xs lg:text-base">446</span>
                </div>

                <!-- Profile Level Badge (Desktop) -->
                <div class="hidden sm:flex items-center gap-2 bg-slate-900/90 border border-purple-500/30 px-3 py-1.5 rounded-full cursor-pointer hover:border-purple-500 transition-all" onclick="switchTab('profile')">
                    <div class="w-6 h-6 rounded-full bg-purple-600 text-white text-xs font-bold flex items-center justify-center" id="userLevelBadge">2</div>
                    <span class="text-xs text-purple-300 font-semibold" id="userLevelName">مبتدئ</span>
                </div>

                <!-- Firebase Auth Button / User Profile Dropdown -->
                <div id="authHeaderArea" class="relative">
                    <!-- Logged Out Button -->
                    <button id="loginHeaderBtn" onclick="openAuthModal('login')" class="flex items-center gap-1.5 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold text-xs px-3.5 py-2 rounded-full transition-all shadow-md glow-purple">
                        <i class="fa-solid fa-user-circle text-sm"></i>
                        <span class="hidden sm:inline">تسجيل الدخول</span>
                    </button>

                    <!-- Logged In Chip -->
                    <div id="userHeaderChip" class="hidden flex items-center gap-2 bg-slate-900 border border-purple-500/40 hover:border-purple-400 py-1 px-2.5 rounded-full cursor-pointer transition-all" onclick="toggleUserDropdown(event)">
                        <div class="w-7 h-7 rounded-full bg-gradient-to-tr from-purple-600 to-cyan-500 flex items-center justify-center text-white text-xs font-bold shadow overflow-hidden" id="headerUserAvatar">
                            <i class="fa-solid fa-user-check"></i>
                        </div>
                        <div class="flex flex-col text-right leading-tight max-w-[100px] truncate">
                            <span class="text-xs font-bold text-white truncate" id="headerUserName">اللاعب</span>
                            <span class="text-[9px] text-emerald-400 flex items-center gap-1">
                                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-subtle"></span>
                                متصل سحابياً
                            </span>
                        </div>
                        <i class="fa-solid fa-chevron-down text-[10px] text-gray-400"></i>
                    </div>

                    <!-- Dropdown Menu -->
                    <div id="userDropdownMenu" class="hidden absolute left-0 mt-2 w-52 bg-slate-900 border border-gray-700/80 rounded-2xl shadow-2xl p-2 z-50 text-xs space-y-1">
                        <div class="p-2 border-b border-gray-800">
                            <p class="font-bold text-white truncate" id="dropdownUserEmail">user@example.com</p>
                            <p class="text-[10px] text-purple-400" id="dropdownUserStatus">حساب سحابي موثق</p>
                        </div>
                        <button onclick="switchTab('profile'); closeUserDropdown();" class="w-full text-right p-2 rounded-xl hover:bg-slate-800 text-gray-300 flex items-center gap-2">
                            <i class="fa-solid fa-id-card text-purple-400"></i> الملف الشخصي والإحصائيات
                        </button>
                        <button onclick="syncDataToCloudNow(); closeUserDropdown();" class="w-full text-right p-2 rounded-xl hover:bg-slate-800 text-gray-300 flex items-center gap-2">
                            <i class="fa-solid fa-cloud-arrow-up text-emerald-400"></i> مزامنة فورية مع السحابة
                        </button>
                        <button onclick="openFirebaseConfigModal(); closeUserDropdown();" class="w-full text-right p-2 rounded-xl hover:bg-slate-800 text-gray-300 flex items-center gap-2">
                            <i class="fa-solid fa-sliders text-cyan-400"></i> إعدادات Firebase
                        </button>
                        <button onclick="openGitHubExportModal(); closeUserDropdown();" class="w-full text-right p-2 rounded-xl hover:bg-slate-800 text-gray-300 flex items-center gap-2">
                            <i class="fa-brands fa-github text-amber-400"></i> تصدير الكود لـ GitHub
                        </button>
                        <div class="border-t border-gray-800 pt-1">
                            <button onclick="handleFirebaseLogout(); closeUserDropdown();" class="w-full text-right p-2 rounded-xl hover:bg-rose-950/40 text-rose-400 flex items-center gap-2">
                                <i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج
                            </button>
                        </div>
                    </div>
                </div>

                <!-- GitHub Quick Export Button -->
                <button onclick="openGitHubExportModal()" title="نسخ الكود بالكامل لنقله إلى GitHub" class="w-8 h-8 rounded-full bg-slate-900 border border-gray-700 hover:border-amber-400 text-gray-300 hover:text-amber-400 flex items-center justify-center transition-all">
                    <i class="fa-brands fa-github text-sm"></i>
                </button>

            </div>
        </div>

        <!-- Mobile Search Input Bar -->
        <div class="mt-3 md:hidden">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="searchInputMobile" oninput="filterGamesMobile()" placeholder="ابحث عن لعبه..." class="w-full bg-slate-900 text-sm text-gray-200 placeholder-gray-500 rounded-full pr-10 pl-4 py-2 border border-gray-800 focus:outline-none focus:border-purple-500">
            </div>
        </div>
    </header>

    <!-- ================= MAIN NAVIGATION TABS ================= -->
    <nav class="bg-brand-card/90 border-b border-gray-800 px-4 py-2.5 overflow-x-auto no-scrollbar sticky top-[65px] z-40">
        <div class="max-w-7xl mx-auto flex items-center gap-2 sm:gap-3 text-xs sm:text-sm font-semibold whitespace-nowrap">
            <button onclick="switchTab('games')" id="tab-games" class="nav-tab bg-purple-600 text-white px-4 py-2 rounded-xl flex items-center gap-2 transition-all">
                <i class="fa-solid fa-gamepad"></i> الألعاب والتحديات
            </button>
            <button onclick="switchTab('quests')" id="tab-quests" class="nav-tab text-gray-400 hover:text-white px-4 py-2 rounded-xl flex items-center gap-2 transition-all">
                <i class="fa-solid fa-list-check"></i> المهام اليومية
            </button>
            <button onclick="switchTab('leaderboard')" id="tab-leaderboard" class="nav-tab text-gray-400 hover:text-white px-4 py-2 rounded-xl flex items-center gap-2 transition-all">
                <i class="fa-solid fa-trophy text-amber-400"></i> لوحة المتصدرين
            </button>
            <button onclick="switchTab('wallet')" id="tab-wallet" class="nav-tab text-gray-400 hover:text-white px-4 py-2 rounded-xl flex items-center gap-2 transition-all">
                <i class="fa-solid fa-award text-emerald-400"></i> متجر الألقاب والشارات
            </button>
            <button onclick="switchTab('profile')" id="tab-profile" class="nav-tab text-gray-400 hover:text-white px-4 py-2 rounded-xl flex items-center gap-2 transition-all">
                <i class="fa-solid fa-user-astronaut text-cyan-400"></i> الملف الشخصي
            </button>
            <button onclick="switchTab('admin')" id="tab-admin" class="nav-tab text-gray-400 hover:text-white px-4 py-2 rounded-xl flex items-center gap-2 transition-all">
                <i class="fa-solid fa-shield-halved text-rose-400"></i> لوحة الإدارة
            </button>
        </div>
    </nav>

    <!-- Cloud Status Banner (Dynamic) -->
    <div id="cloudSyncAlert" class="bg-slate-900 border-b border-purple-500/20 py-1.5 px-4 text-center text-xs text-purple-300 flex items-center justify-center gap-2">
        <span id="cloudStatusDot" class="w-2 h-2 rounded-full bg-emerald-400"></span>
        <span id="cloudStatusText"><span class="text-emerald-400 font-bold">✓ تم التحقق: Firebase متصل بنجاح</span> <span class="text-gray-300">(moataz-games)</span></span>
        <button onclick="openFirebaseConfigModal()" class="text-cyan-400 hover:underline font-bold text-[11px] mr-2">⚙️ إعدادات Firebase</button>
    </div>

    <!-- ================= MAIN CONTENT CONTAINER ================= -->
    <main class="max-w-7xl mx-auto px-4 lg:px-8 py-6 w-full flex-grow">

        <!-- ================= TAB 1: GAMES & CHALLENGES ================= -->
        <section id="section-games" class="tab-content space-y-8">
            
            <!-- Hero Banner -->
            <div class="relative rounded-3xl overflow-hidden border border-purple-500/20 p-6 lg:p-10 bg-gradient-to-br from-purple-950/40 via-brand-dark to-cyan-950/30">
                <div class="relative z-10 max-w-2xl space-y-4">
                    <div class="inline-flex items-center gap-2 bg-purple-500/10 border border-pur
